<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<!-- Tailwind and DasyUI -->
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<!-- Fontawsome -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />


<style>
  * {
    font-family: "Geist", sans-serif;
  }
  .cBorder {
    border: 1px solid #E4E4E7;
  }
</style>
</head>

<body class="bg-[#F8FAFC]">
  
<header>
<div class="navbar bg-base-100 shadow-sm py-4">
<div class="w-10/11 mx-auto flex md:flex-row flex-col md:gap-0 gap-5 items-center">
  <div class="flex-1 flex items-center gap-2">
    <img class="w-[50px]" src="./assets/github-logo.png" alt="">
    <a class="text-[24px] text-[#1F2937] font-semibold">GitHub Issues Tracker</a>
  </div>

  <div class="flex gap-2 items-center">
    <label class="input">
  <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <g
      stroke-linejoin="round"
      stroke-linecap="round"
      stroke-width="2.5"
      fill="none"
      stroke="currentColor"
    >
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.3-4.3"></path>
    </g>
  </svg>
  <input type="search" required placeholder="Search" />
</label>
    <button class="btn btn-primary font-semibold text-[16px]"><i class="fa-solid fa-plus"></i> Primary</button>
  </div>
</div>
</div>

</header>

<section class="md:py-24 px-4 md:px-0 py-2">

  <!-- name of each tab group should be unique -->
<div class="tabs tabs-box w-full md:w-10/14 mx-auto px-6 py-6 bg-white gap-2 flex flex-col md:flex-row">
  <input type="radio" name="my_tabs_1" class="tab [--tab-bg:#4A00FF] checked:text-white w-full md:w-[120px] cBorder checked:border-transparent!" aria-label="All" checked="checked"/>
  <input type="radio" name="my_tabs_1" class="tab [--tab-bg:#4A00FF] checked:text-white w-full md:w-[120px] cBorder checked:border-transparent!" aria-label="Open"  />
  <input type="radio" name="my_tabs_1" class="tab [--tab-bg:#4A00FF] checked:text-white w-full md:w-[120px] cBorder checked:border-transparent!" aria-label="Closed" />
</div>

</section>

</body>

</html>
